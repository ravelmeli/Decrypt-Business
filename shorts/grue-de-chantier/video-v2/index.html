    <script type="module">

      const matCache = {};
      const M = (hex) => (matCache[hex] = matCache[hex] || new THREE.MeshStandardMaterial({ color: hex, roughness: 0.78, metalness: 0 }));

      }

      /* ---------- ISLAND ---------- */
      const island = grp(scene);
      put(island, rbox(9.4, 0.5, 9.4, P.lilac, 0.1), 0, -0.5, 0);
      put(island, rbox(9.0, 0.7, 9.0, P.deep, 0.1), 0, -1.2, 0);

        const tl_ = put(island, rbox(0.96, 0.28, 0.96, hex, 0.05), i - 4, 0, j - 4);
        tiles.push({ o: tl_, k: Math.hypot(i - 4, j - 4) });
      }
      const TOP = 0.28;

      /* ---------- CRANE BUILDER ---------- */
      function buildCrane(x, z, s, C) {
        const g = grp(scene, x, TOP, z); g.scale.setScalar(s);
        const mats = [];
        const cm = (hex) => { const m = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.75 }); mats.push({ m, base: new THREE.Color(hex) }); return m; };
        const mBody = cm(C.body), mBrace = cm(C.brace), mCab = cm(C.cab), mWeight = cm(C.weight), mBase = cm(P.gray);
        const base = put(g, rbox(1.9, 0.35, 1.9, null, 0.08, mBase));
        const secs = [];
        for (let k = 0; k < 7; k++) {
          const sg = grp(g, 0, 0.35 + k, 0);
          for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) put(sg, rbox(0.12, 1, 0.12, null, 0.03, mBody), sx * 0.4, 0, sz * 0.4);

          for (const sx of [-1, 1]) put(sg, rbox(0.07, 0.07, 0.9, null, 0.02, mBrace), sx * 0.4, 0, 0);
          for (const sz of [-1, 1]) { const d = put(sg, rbox(0.06, 1.2, 0.06, null, 0.02, mBrace), 0, 0, sz * 0.4); d.rotation.z = 0.62 * (sz > 0 ? 1 : -1); d.position.y = 0.0; d.geometry = d.geometry; }

        put(jib, rbox(0.14, 1.0, 0.14, null, 0.04, mBody), 0.6 + JL - 0.5, 0, 0);
        const cj = grp(g, 0, 7.65, 0);

        put(cj, rbox(2.6, 0.1, 0.1, null, 0.03, mBody), -1.4, 0.5, 0);

      function updCrane(c, t, t0) {

      const cone = (x, z) => { const g = grp(scene, x, TOP, z); const c = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 10), M(P.peach)); c.position.y = 0.25; c.castShadow = true; g.add(c); put(g, rbox(0.46, 0.06, 0.46, P.white, 0.02)); return g; };

      fence.position.set(-0.2, TOP, 3.9); sitePops.push([fence, 4.3]);

      /* ---------- COINS ---------- */
      function mkCoins(n, x, z) {

      const mHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), M("#ffe2cc")); mHead.position.y = 1.35; mHead.castShadow = true; man.add(mHead);
      const legL = put(man, rbox(0.12, 0.45, 0.12, P.navy, 0.04), -0.1, 0.0, 0), legR = put(man, rbox(0.12, 0.45, 0.12, P.navy, 0.04), 0.1, 0.0, 0);
      const caseB = put(man, rbox(0.34, 0.26, 0.1, P.peach, 0.04), 0.34, 0.35, 0);

      /* ---------- COST CUBES / LOAN / DEBT / BARS / PADS / WEEKS / BUILDING ---------- */
      const cost1 = rbox(1.1, 1.8, 1.1, P.coral, 0.1); put(scene, cost1, 3.0, TOP, -0.6);
      const cost2 = rbox(1.1, 1.2, 1.1, P.sky, 0.1); put(scene, cost2, 3.4, TOP, 1.0);
      const cost3 = rbox(1.1, 0.8, 1.1, P.lilac, 0.1); put(scene, cost3, -0.6, TOP, 2.6);
      const meter = rbox(1.2, 1, 1.2, P.coral, 0.1); put(scene, meter, 2.4, TOP, 2.4);
      const loan = rbox(1.2, 1.2, 1.2, P.sky, 0.1); put(scene, loan, 3.2, TOP, 0.3);
      const debt = []; for (let k = 0; k < 6; k++) { const b = rbox(1.2, 0.46, 1.2, k % 2 ? P.coral : "#ff9fa3", 0.08); put(scene, b, 2.4, TOP + k * 0.5, 2.4); debt.push(b); }
      const occBar = rbox(0.5, 0.5, 0.5, P.mint, 0.1); put(scene, occBar, 0, TOP, 0);
      const poleA = rbox(0.2, 1.7, 0.2, P.gray, 0.05), poleB = rbox(0.2, 0.5, 0.2, P.gray, 0.05);
      put(scene, poleA, -0.4, TOP, 1.6); put(scene, poleB, 2.0, TOP, 1.6);
      const barNew = rbox(1.3, 3.0, 1.3, P.gold, 0.12); put(scene, barNew, -0.4, TOP + 1.7, 1.6);
      const barUsed = rbox(1.3, 2.2, 1.3, P.mint, 0.12); put(scene, barUsed, 2.0, TOP + 0.5, 1.6);
      const padL = rbox(1.6, 0.5, 1.6, P.sky, 0.1); put(scene, padL, -2.2, TOP, 1.9);
      const padR = rbox(1.6, 0.5, 1.6, P.mint, 0.1); put(scene, padR, 1.9, TOP, 2.2);
      const weeks = []; for (let i = 0; i < 8; i++) { const m = new THREE.MeshStandardMaterial({ color: P.white, roughness: 0.75 }); const w = rbox(0.7, 0.5, 0.85, null, 0.08, m); put(scene, w, -3.4 + i * 0.98, TOP, 3.7); weeks.push({ w, m }); }
      const bld = grp(scene, 2.7, TOP, -1.9);
      const floors = [];
      for (let k = 0; k < 4; k++) {
        const f = grp(bld, 0, k * 0.85, 0); put(f, rbox(1.7, 0.8, 1.7, k % 2 ? P.white : "#ebe7fb", 0.08));
        for (const wx of [-0.45, 0.45]) { put(f, rbox(0.38, 0.4, 0.05, "#8fb6ff", 0.02), wx, 0.2, 0.86); put(f, rbox(0.05, 0.4, 0.38, "#8fb6ff", 0.02), 0.86, 0.2, wx); }
        floors.push(f);
      }
      const roof = put(bld, rbox(1.9, 0.14, 1.9, P.coral, 0.05), 0, 3.4, 0);
      const colC = new THREE.Color(), grayC = new THREE.Color("#d5d3e2"), coralC = new THREE.Color(P.coral), whiteC = new THREE.Color(P.white), mintC = new THREE.Color(P.green);

      /* ---------- CLOUDS ---------- */
      const clouds = [];
      [[-9, 5, -8, 1], [8, 6, -9, 1.2], [-3, 8, -11, 0.9], [11, 4, -4, 1.0]].forEach(([x, y, z, sc], i) => {
        const g = grp(scene, x, y, z); [[0, 0, 0, 1], [0.9, -0.1, 0.2, 0.75], [-0.9, -0.15, 0, 0.7]].forEach(([dx, dy, dz, r]) => {
          const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 1 })); m.position.set(dx, dy, dz); g.add(m);
        }); g.scale.setScalar(sc); clouds.push({ g, x, i });
      });

      /* ---------- DOM CARDS ---------- */
      const cardsRoot = document.getElementById("cards");
      const cards = [];
      const card = (html, cls, anchor, t0, t1, off = [0, 0]) => { const d = document.createElement("div"); d.className = "card " + cls; d.innerHTML = html; cardsRoot.appendChild(d); cards.push({ d, anchor, t0, t1, off }); return d; };
      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const zz = ["Z", "Z", "z"].map((c, i) => { const d = document.createElement("div"); d.className = "zz"; d.textContent = c; d.style.fontSize = 64 - i * 14 + "px"; cardsRoot.appendChild(d); return d; });
      const sparks = [0, 1, 2, 3].map(() => { const d = document.createElement("div"); d.className = "zz"; d.textContent = "✦"; d.setAttribute("data-layout-allow-overlap", ""); d.style.color = "#a86a00"; cardsRoot.appendChild(d); return d; });

      card("<small>Grue neuve</small><b>200 000 – 500 000 €+</b>", "gold", V(2.4, 3.2, 2.4), 6.0, 7.7);
      card("<b>?</b>", "sm", () => V(man.position.x, 2.2, man.position.z), 8.6, 10.7);
      card("<small>Prix ≠ coût</small><b>La partie cachée</b>", "sm", V(0.8, 4.2, 0.4), 11.9, 14.8);
      card("<small>Dette</small><b>PRÊT</b>", "coral sm", V(3.0, 2.8, -0.6), 12.4, 14.8);
      card("<small>Coût</small><b>INTÉRÊTS</b>", "sm", V(3.4, 2.2, 1.0), 12.8, 14.8);
      card("<small>Coût</small><b>TEMPS</b>", "sm", V(-0.6, 1.8, 2.6), 13.2, 14.8);
      card("<small>Pendant ce temps</small><b>ça coûte</b>", "coral sm", V(2.4, 3.2, 2.4), 16.2, 18.7);
      card("<small>Semaines perdues</small><b>▮▮▮▮▮▮▮▮</b>", "coral sm", V(0, 1.5, 3.7), 20.2, 25.4);
      card("<small>Prêt</small><b>toujours là</b>", "sm", V(3.2, 2.8, 0.3), 20.0, 25.4);
      card("<small>Vu par le client</small><b>De l'acier</b>", "gold sm", () => c1Top.clone().add(V(2.2, 0.9, 0)), 26.3, 31.6);
      card("<small>Vu par le bilan</small><b>Une dette</b>", "coral sm", V(2.4, 4.1, 2.4), 28.4, 32.0);
      card("<small>Parade</small><b>OCCASION</b>", "mint", V(2.7, 5.9, -3.0), 33.1, 35.4);
      card("<small>Neuf</small><b>200 000 – 500 000 €+</b>", "gold sm", V(-0.4, 6.4, 1.6), 37.0, 42.0);
      card("<small>Occasion</small><b>80 000 – 300 000 €</b>", "mint sm", V(2.0, 3.8, 1.6), 38.4, 42.0);
      card("<small>Option 1</small><b>LOUER ✓</b>", "sm", V(-2.2, 2.6, 1.9), 42.8, 46.5);
      card("<small>Option 2</small><b>OCCASION ✓</b>", "mint sm", V(1.9, 2.6, 2.2), 43.4, 46.5);
      card("<small>Au travail</small><b>Elle rapporte</b>", "mint sm", V(2.7, 5.4, -1.9), 48.6, 50.3);
      card("<small>Gardée occupée</small><b>Rentable</b>", "mint sm", V(2.4, 3.5, 2.4), 52.0, 55.6);

      /* ---------- CAMERA ---------- */
      const camKeys = [
        [0, 0, 1.2, 0, 0.95], [3, 0, 1.8, 0, 1.0], [8, 0, 1.4, 0.6, 1.0], [11.6, 0.6, 1.6, 0.6, 1.0], [15.2, 0, 1.8, 0, 1.05],
        [19.1, 0, 1.4, 0.4, 1.0], [26, -0.6, 2.0, 0, 1.06], [33, 0.8, 1.8, -0.6, 1.02], [36.3, 0.6, 1.6, 0.8, 1.04], [42.2, 0, 1.4, 0.6, 1.0],
        [47.2, 1.0, 2.2, -0.8, 1.04], [50.6, 0, 1.6, 0.4, 1.0], [56.1, 0, 1.4, 0, 0.92], [60.4, 0, 1.2, 0, 0.88],
      ];
      function camAt(t) {
        let i = 0; while (i < camKeys.length - 2 && t > camKeys[i + 1][0]) i++;
        const a = camKeys[i], b = camKeys[i + 1]; const k = eInOut(prog(t, a[0], b[0] - a[0]));
        return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k), lerp(a[4], b[4], k)];
      }
      const dirv = new THREE.Vector3(1, 1, 1).normalize();
      const pv = new THREE.Vector3();

      function renderAt(t) {
        /* island wave */
        tiles.forEach(({ o, k }) => { const t0 = 0.05 + k * 0.1; const p = prog(t, t0, 0.65); o.visible = p > 0; o.position.y = (1 - bounce(p)) * 6; });
        island.children[0].visible = island.children[1].visible = true;
        /* cranes */
        updCrane(crane1, t, 1.2);
        const c1 = crane1;
        let trolleyX = 3.5 + Math.sin(prog(t, 3.4, 3.2) * Math.PI * 2) * 1.0 * (t < 7 ? 1 : 0), cableL = 2.2, loadVis = 0;
        if (t >= 15.2 && t < 19.5) trolleyX = 3.5 + Math.sin((t - 15.2) * 1.4) * 0.12;
        if (t >= 47.2 && t < 55) {
          const a = eInOut(prog(t, 47.2, 0.9)), b = eInOut(prog(t, 48.0, 0.7)), c = eInOut(prog(t, 49.4, 0.5));
          trolleyX = lerp(3.5, 4.9, a) ; cableL = 2.2 + 3.6 * b - 3.6 * c; loadVis = t < 48.7 ? 1 : 0;
          if (t > 50.7) { trolleyX = 4.9 - 1.4 * eInOut(prog(t, 50.7, 1.2)) + 1.4 * eInOut(prog(t, 52.0, 1.2)) - 1.4 * eInOut(prog(t, 53.3, 1.2)); cableL = 2.2; }
        }
        c1.trolley.position.x = trolleyX; c1.cable.scale.y = cableL; c1.hook.position.y = -0.2 - cableL; c1.load.visible = loadVis > 0;
        c1.trolley.visible = c1.trolley.visible && true;
        /* crane sleep tint */
        const sleep = prog(t, 15.3, 0.6) * (1 - prog(t, 24.9, 0.5));
        c1.mats.forEach(({ m, base }) => m.color.copy(base).lerp(grayC, sleep * 0.85));
        c1Top.set(-2.2, TOP + 9.0, -2.2); c1Tip.set(-2.2 + 7.2, TOP + 8.4, -2.2);
        /* crane 2 (used) */
        updCrane(crane2, t, 33.1);
        const vis2 = 1 - eOut(prog(t, 35.7, 0.4)); crane2.g.visible = t >= 33.1 && vis2 > 0.01; crane2.g.scale.setScalar(0.7 * Math.max(vis2, 0.001));
        crane2.trolley.position.x = 3.5; crane2.cable.scale.y = 2.0; crane2.hook.position.y = -2.2; crane2.load.visible = false;
        /* site props */
        sitePops.forEach(([o, t0]) => appear(o, t, t0, null, "pop", 0.45));
        /* coins */
        updCoins(coins1, t, 3.2, 0.45, 7.6); coins1.g.visible = t < 8.1;
        updCoins(coins2, t, 51.0, 0.45, null); coins2.g.visible = t >= 50.9;
        /* entrepreneur */
        const wp = prog(t, 8.1, 2.7); man.visible = t >= 8.0 && t < 10.9;
        man.position.set(lerp(1.0, 4.2, wp), TOP + Math.abs(Math.sin(t * 9)) * 0.05, lerp(2.4, 4.4, wp));
        man.rotation.y = -Math.atan2(3.2, 2.0) + Math.PI / 2 + 0.0; man.scale.setScalar(1 - eOut(prog(t, 10.5, 0.4)));
        legL.rotation.x = Math.sin(t * 9) * 0.6; legR.rotation.x = -Math.sin(t * 9) * 0.6;
        /* cost cubes */
        const hide3 = (t1) => 1 - eOut(prog(t, t1, 0.35));
        const grow = (o, t0, t1, d = 0.5) => { const s = popS(t, t0, d) * hide3(t1); o.visible = s > 0.002; o.scale.set(Math.max(s, 0.001), Math.max(s, 0.001), Math.max(s, 0.001)); };
        grow(cost1, 12.2, 14.8); grow(cost2, 12.6, 14.8); grow(cost3, 13.0, 14.8);
        grow(meter, 15.5, 18.9); if (meter.visible) meter.scale.y = Math.max(0.2, (1 + 3.6 * prog(t, 16.0, 2.4)) * Math.max(popS(t, 15.5, 0.4) * hide3(18.9), 0.001));
        grow(loan, 19.8, 25.5); if (loan.visible) { const pulse = 1 + 0.07 * Math.sin((t - 20.6) * 6.5); loan.scale.set(pulse, pulse, pulse); }
        debt.forEach((b, k) => grow(b, 28.4 + k * 0.4, 32.0, 0.35));
        grow(occBar, 99, 99);
        grow(poleA, 36.4, 42.0); grow(poleB, 36.4, 42.0); grow(barNew, 36.6, 42.0, 0.6); grow(barUsed, 37.4, 42.0, 0.6);
        grow(padL, 42.3, 46.6); grow(padR, 42.8, 46.6);
        /* weeks */
        weeks.forEach(({ w, m }, i) => {
          const inS = popS(t, 19.2 + i * 0.12, 0.35) * hide3(25.6); const inG = t >= 50.85 ? popS(t, 50.85 + i * 0.35 - 0.05, 0.35) : 0;
          const s = t < 30 ? inS : inG; w.visible = s > 0.002; w.scale.set(1, Math.max(s, 0.001), 1);
          const red = prog(t, 22.0 + i * 0.3, 0.25); const grn = prog(t, 50.9 + i * 0.35, 0.25);
          if (t < 30) colC.copy(whiteC).lerp(coralC, red); else colC.copy(whiteC).lerp(mintC, grn);
          m.color.copy(colC);
        });
        /* building */
        const ox = 0;
        floors.forEach((f, k) => appear(f, t, 48.7 + k * 0.45, null, "y", 0.4));
        appear(roof, t, 50.6, null, "pop", 0.4);
        bld.visible = t >= 48.6;
        /* clouds */
        clouds.forEach(({ g, x, i }) => { g.position.x = ((x + t * (0.25 + i * 0.05) + 14) % 28) - 14; });
        /* zzz + sparks */
        zz.forEach((d, i) => {
          const p = prog(t, 15.4 + i * 0.5, 1.2); const o = (t >= 15.4 && t < 18.5) ? Math.sin(p * Math.PI) : 0;
          pv.copy(c1Tip).add(V(0.3 + i * 0.35, 0.7 + p * 1.2 + i * 0.5, 0)).project(cam);
          d.style.opacity = o; d.style.transform = `translate(${(pv.x * 0.5 + 0.5) * W}px,${(-pv.y * 0.5 + 0.5) * H}px) translate(-50%,-50%)`;
        });
        sparks.forEach((d, i) => {
          const p = prog(t, 26.3 + i * 0.5, 0.5); const o = (t >= 26.3 && t < 31.6) ? p * (0.6 + 0.4 * Math.sin(t * 8 + i)) : 0;
          pv.set(-2.2 + 1.2 + i * 1.7, TOP + 5.2 + (i % 2) * 2.2, -2.2 + (i % 2 ? 0.8 : -0.8)).project(cam);
          d.style.opacity = o; d.style.transform = `translate(${(pv.x * 0.5 + 0.5) * W}px,${(-pv.y * 0.5 + 0.5) * H}px) translate(-50%,-50%)`;
        });
        /* camera */
        const [cx, cy0, cz, zoom0] = camAt(t);
        const cy = cy0 + 0.9, zoom = zoom0 * 0.9;
        cam.zoom = zoom; cam.updateProjectionMatrix();
        cam.position.set(cx, cy, cz).addScaledVector(dirv, 80); cam.lookAt(cx, cy, cz);
        cam.updateMatrixWorld();
        /* cards */
        for (const c of cards) {
          const s = eOutBack(prog(t, c.t0, 0.45)) * (1 - eOut(prog(t, c.t1, 0.3)));
          if (s <= 0.01) { c.d.style.opacity = 0; continue; }
          const a = typeof c.anchor === "function" ? c.anchor(t) : c.anchor; pv.copy(a).project(cam);
          c.d.style.opacity = Math.min(1, s * 1.5);
          c.d.style.transform = `translate(${(pv.x * 0.5 + 0.5) * W + c.off[0]}px,${(-pv.y * 0.5 + 0.5) * H + c.off[1]}px) translate(-50%,-100%) scale(${s})`;
        }
        renderer.render(scene, cam);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(window.__hfThreeTime || 0));
      renderAt(window.__hfThreeTime || 0);
    </script>
