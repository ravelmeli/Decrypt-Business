          const a = eInOut(prog(t, 47.2, 0.9)), b = eInOut(prog(t, 48.0, 0.7)), c = eInOut(prog(t, 49.4, 0.5));
          trolleyX = lerp(3.5, 4.9, a); cableL = 2.2 + 3.6 * b - 3.6 * c; loadVis = t < 48.7 ? 1 : 0;
          if (t > 50.7) { trolleyX = 4.9 - 1.4 * eInOut(prog(t, 50.7, 1.2)) + 1.4 * eInOut(prog(t, 52.0, 1.2)) - 1.4 * eInOut(prog(t, 53.3, 1.2)); cableL = 2.2; }
        }
        c1.trolley.position.x = trolleyX; c1.cable.scale.y = cableL; c1.hook.position.y = -0.2 - cableL; c1.load.visible = loadVis > 0;
        const sleep = prog(t, 15.3, 0.6) * (1 - prog(t, 24.9, 0.5));
        c1.mats.forEach(({ m, base }) => m.color.copy(base).lerp(grayC, sleep * 0.85));
        updCrane(crane2, t, T.crane2);
        const vis2 = 1 - eOut(prog(t, 35.7, 0.4)); crane2.g.visible = t >= T.crane2 && vis2 > 0.01; crane2.g.scale.setScalar(0.7 * Math.max(vis2, 0.001));
        crane2.trolley.position.x = 3.5; crane2.cable.scale.y = 2.0; crane2.hook.position.y = -2.2; crane2.load.visible = false;
        /* site props, workers, vehicles, turbine */
        sitePops.forEach(([o, t0]) => appear(o, t, t0, null, "pop", 0.45));
        turbine.userData.rot.rotation.z = t * 1.6;
        workers.forEach(([w, t0]) => appear(w.g, t, t0, null, "pop", 0.4));
        w1.g.position.x = -1.4 + 1.3 * (0.5 + 0.5 * Math.sin(t * 0.9)); w1.g.rotation.y = Math.cos(t * 0.9) > 0 ? Math.PI / 2 : -Math.PI / 2;
        w1.legL.rotation.x = Math.sin(t * 8) * 0.6; w1.legR.rotation.x = -Math.sin(t * 8) * 0.6; w1.armL.rotation.x = -Math.sin(t * 8) * 0.5; w1.armR.rotation.x = Math.sin(t * 8) * 0.5;
        w2.armR.rotation.x = -1.3 + Math.sin(t * 9) * 0.7; w2.g.rotation.y = Math.PI / 2;
        w3.g.position.z = -0.9 + 1.3 * (0.5 + 0.5 * Math.sin(t * 0.7 + 1)); w3.g.rotation.y = Math.cos(t * 0.7 + 1) > 0 ? 0 : Math.PI;
        w3.legL.rotation.x = Math.sin(t * 7) * 0.6; w3.legR.rotation.x = -Math.sin(t * 7) * 0.6; w3.armL.rotation.x = -Math.sin(t * 7) * 0.5; w3.armR.rotation.x = Math.sin(t * 7) * 0.5;
        w4.armR.rotation.z = 2.6 + Math.sin(t * 6) * 0.4; w4.g.rotation.y = Math.PI / 4;
        vehicles.forEach(([g, off, sp], i) => { const a = appear(g, t, 1.8 + i * 0.25, null, "pop", 0.4); placeOnRing(g, off + (t - 1.8) * 2.0 * sp); g.scale.setScalar(Math.max(a, 0.0001)); if (g.userData.sp) g.userData.sp.rotation.z = t * 4; });
        /* coins */
        updCoins(coins1, t, T.coins1.t0, T.coins1.step, T.coins1.out); coins1.g.visible = t < 8.1;
        updCoins(coins2, t, T.coins2.t0, T.coins2.step, null); coins2.g.visible = t >= 50.9;
        /* entrepreneur */
        const wp = prog(t, T.man[0], 2.7); man.visible = t >= T.man[0] - 0.1 && t < 10.9;
        man.position.set(lerp(1.0, 4.2, wp), TOP + Math.abs(Math.sin(t * 9)) * 0.05, lerp(2.4, 4.4, wp));
        man.rotation.y = -Math.atan2(3.2, 2.0) + Math.PI / 2; man.scale.setScalar(1 - eOut(prog(t, 10.5, 0.4)));
        legL.rotation.x = Math.sin(t * 9) * 0.6; legR.rotation.x = -Math.sin(t * 9) * 0.6;
        /* cost cubes etc. */
        const hide3 = (t1) => 1 - eOut(prog(t, t1, 0.35));
        const grow = (o, t0, t1, d = 0.5) => { const s = popS(t, t0, d) * hide3(t1); o.visible = s > 0.002; o.scale.setScalar(Math.max(s, 0.001)); };
        grow(cost1, T.cost[0], 14.8); grow(cost2, T.cost[1], 14.8); grow(cost3, T.cost[2], 14.8);
        grow(meter, T.meter, 18.9); if (meter.visible) meter.scale.y = Math.max(0.2, (1 + 3.6 * prog(t, 16.0, 2.4)) * Math.max(popS(t, T.meter, 0.4) * hide3(18.9), 0.001));
        grow(loan, T.loan, 25.5); if (loan.visible) { const pulse = 1 + 0.07 * Math.sin((t - 20.6) * 6.5); loan.scale.set(pulse, pulse, pulse); }
        debt.forEach((b, k) => grow(b, T.debt.t0 + k * T.debt.step, 32.0, 0.35));
        grow(poleA, T.bars[0], 42.0); grow(poleB, T.bars[0], 42.0); grow(barNew, T.bars[1], 42.0, 0.6); grow(barUsed, T.bars[2], 42.0, 0.6);
        grow(padL, T.pads[0], 46.6); grow(padR, T.pads[1], 46.6);
        weeks.forEach(({ w, m }, i) => {
          const inS = popS(t, T.weeksIn + i * 0.12, 0.35) * hide3(T.weeksOut); const inG = t >= T.weeksGreen ? popS(t, T.weeksGreen + i * 0.35 - 0.05, 0.35) : 0;
          const s = t < 30 ? inS : inG; w.visible = s > 0.002; w.scale.set(1, Math.max(s, 0.001), 1);
          const red = prog(t, T.weeksRed + i * 0.3, 0.25); const grn = prog(t, T.weeksGreen + i * 0.35, 0.25);
          if (t < 30) colC.copy(whiteC).lerp(coralC, red); else colC.copy(whiteC).lerp(mintC, grn);
          m.color.copy(colC);
        });
        floors.forEach((f, k) => appear(f, t, T.floors.t0 + k * T.floors.step, null, "y", 0.4));
        const golden = prog(t, 50.8, 5.2);
        winMats.forEach((wm, k) => { const on = prog(t, T.floors.t0 + k * T.floors.step + 0.5, 0.2); wm.emissiveIntensity = on * (0.6 + 0.9 * golden); });
        lampMats.forEach((lm) => { lm.emissiveIntensity = golden * 1.6; });
        appear(roof, t, T.roof, null, "pop", 0.4); bld.visible = t >= T.floors.t0 - 0.1;
        /* title plaque */
        const pp = prog(t, T.plaque, 0.8); plaque.visible = pp > 0; plaque.position.y = lerp(-4, 0, eOutBack(pp)); plaque.scale.setScalar(Math.max(0.2 + 0.8 * eOut(pp), 0.001));
        clouds.forEach(({ g, x, i }) => { g.position.x = ((x + t * (0.25 + i * 0.05) + 14) % 28) - 14; });
        /* zzz + sparks */
        zz.forEach((d, i) => {
          const p = prog(t, 15.4 + i * 0.5, 1.2); const o = (t >= 15.4 && t < 18.5) ? Math.sin(p * Math.PI) : 0;
          pv.copy(c1Tip).add(V(0.3 + i * 0.35, 0.7 + p * 1.2 + i * 0.5, 0)).project(cam);
          d.style.opacity = o; d.style.transform = `translate(${(pv.x * 0.5 + 0.5) * W}px,${(-pv.y * 0.5 + 0.5) * H}px) translate(-50%,-50%)`;
        });
        sparks.forEach((d, i) => {
          const p = prog(t, 26.3 + i * 0.5, 0.5); const o = (t >= 26.3 && t < 31.6) ? p * (0.6 + 0.4 * Math.sin(t * 8 + i)) : 0;
          pv.set(-2.2 + 1.2 + i * 1.7, TOP + 5.2 + (i % 2) * 2.2, -2.2 + (i % 2 ? 0.8 : -0.8)).project(cam);
          d.style.opacity = o; d.style.transform = `translate(${(pv.x * 0.5 + 0.5) * W}px,${(-pv.y * 0.5 + 0.5) * H}px) translate(-50%,-50%)`;
        });
        /* golden hour */
        sun.color.copy(SUN0).lerp(SUN1, golden); sun.intensity = 2.1 + 0.5 * golden; sun.position.set(-12 - 4 * golden, 22 - 10 * golden, 9 + 2 * golden);
        hemi.groundColor.copy(HG0).lerp(HG1, golden); hemi.intensity = 1.25 - 0.1 * golden;
        rootEl.style.background = `linear-gradient(180deg, ${mixHex(SKY0[0], SKY1[0], golden)} 0%, ${mixHex(SKY0[1], SKY1[1], golden)} 45%, ${mixHex(SKY0[2], SKY1[2], golden)} 100%)`;
        /* counters */
        const cu = prog(t, 0.0, 1.0), cE = eOut(cu);
        if (t < 8) { const a = n1(), b = n2(); if (a) a.textContent = fmt(200000 * cE); if (b) b.textContent = fmt(500000 * cE); }
        /* camera */
        const [cx, cy, cz, zoom] = camAt(t);
        cam.zoom = zoom; cam.updateProjectionMatrix();
        cam.position.set(cx, cy, cz).addScaledVector(dirv, 80); cam.lookAt(cx, cy, cz); cam.updateMatrixWorld();
        /* cards */
        for (const c of cards) {
          const s = eOutBack(prog(t, c.t0, 0.45)) * (1 - eOut(prog(t, c.t1, 0.3)));
          if (s <= 0.01) { c.d.style.opacity = 0; continue; }
          if (c.count) { const e = eOut(prog(t, c.t0 + 0.15, 0.9)); c.count.forEach(([idx, v]) => { c.spans[idx].textContent = fmt(v * e); }); }
          const a = typeof c.anchor === "function" ? c.anchor(t) : c.anchor; pv.copy(a).project(cam);
          const hw = (c.d.offsetWidth || 300) / 2 + 24; const cxp = Math.min(W - hw, Math.max(hw, (pv.x * 0.5 + 0.5) * W));
          c.d.style.opacity = Math.min(1, s * 1.5);
          c.d.style.transform = `translate(${cxp}px,${(-pv.y * 0.5 + 0.5) * H}px) translate(-50%,-100%) scale(${s})`;
        }
        /* karaoke captions */
        (window.CAPTOK || []).forEach((cp) => { if (t < cp.a - 0.1 || t > cp.b + 0.3) return; let act = -1; cp.starts.forEach((s, k) => { if (t >= s) act = k; });
          cp.spans.forEach((sp, k) => { const on = k === act; sp.style.opacity = k <= act ? 1 : 0.5; sp.style.color = on ? "#7b5cf0" : "#2f2e7a"; sp.style.transform = on ? "scale(1.05)" : "scale(1)"; }); });
        grainEl.style.backgroundPosition = `${(Math.round(t * 30) % 7) * 37}px ${(Math.round(t * 30) % 5) * 53}px`;
        renderer.render(scene, cam);
        fxbCtx.clearRect(0, 0, 540, 960); fxbCtx.drawImage(glCanvas, 0, 0, 540, 960);
        fxgCtx.clearRect(0, 0, 270, 480); fxgCtx.drawImage(glCanvas, 0, 0, 270, 480);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(window.__hfThreeTime || 0));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
