            if (w !== undefined) { const g = eOut(prog(t, p.t0 + 0.35 + i * 0.2, 0.8)); it.style.width = Number(w) * g + "%"; it.style.opacity = g > 0.02 ? 1 : 0; }

        /* captions: rolling window, active word in a gold pill */

        progEl.style.width = (t / B.dur) * 100 + "%";
        const bp = prog(t, T.brand, 0.6) * (1 - prog(t, B.dur - B.loop + 0.3, 0.7)); brandEl.style.opacity = bp; brandEl.style.transform = `scale(${0.9 + 0.1 * eOutBack(bp)})`;
        flashEl.style.opacity = 0;   /* the Short loops: no fade to black at the end */
        renderer.render(scene, cam);

      }
